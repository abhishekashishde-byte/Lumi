name: Complete Lumi migration

on:
  push:
    branches: [main]
    paths:
      - '.migration/**'
      - '.github/workflows/migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble cleaned Lumi archive
        run: |
          cat .migration/part-* > /tmp/lumi-clean.tar.gz
          tar -xzf /tmp/lumi-clean.tar.gz -C .
          rm -rf .migration .github/workflows/migrate.yml
      - name: Commit migrated app
        run: |
          git config user.name "Lumi Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Migrate cleaned Lumi app off Lovable" || exit 0
          git push
